<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Repo Analyzer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; padding: 40px 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; color: #58a6ff; margin-bottom: 10px; font-size: 28px; }
    p.subtitle { text-align: center; color: #8b949e; margin-bottom: 30px; }
    textarea { width: 100%; height: 120px; background: #161b22; border: 1px solid #30363d; color: #c9d1d9; padding: 12px; border-radius: 8px; font-size: 14px; resize: vertical; }
    button { display: block; width: 100%; padding: 12px; margin-top: 12px; background: #238636; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    button:hover { background: #2ea043; }
    button:disabled { background: #444; cursor: not-allowed; }
    #results { margin-top: 30px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    .card h2 { color: #58a6ff; font-size: 18px; margin-bottom: 8px; }
    .card p { color: #8b949e; margin-bottom: 12px; font-size: 14px; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 12px; }
    .Beginner { background: #1f6feb; color: white; }
    .Intermediate { background: #d29922; color: white; }
    .Advanced { background: #da3633; color: white; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 12px; }
    .stat { background: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 10px; text-align: center; }
    .stat .value { font-size: 20px; font-weight: bold; color: #58a6ff; }
    .stat .label { font-size: 11px; color: #8b949e; margin-top: 4px; }
    .languages { margin-top: 10px; }
    .lang-tag { display: inline-block; background: #21262d; color: #c9d1d9; padding: 3px 10px; border-radius: 12px; font-size: 12px; margin: 3px; }
    .error-card { background: #1c1414; border: 1px solid #da3633; border-radius: 10px; padding: 15px; margin-bottom: 15px; color: #f85149; }
    .loading { text-align: center; color: #58a6ff; padding: 20px; font-size: 16px; }
    .scores { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
    .score-box { background: #21262d; padding: 8px 14px; border-radius: 6px; font-size: 13px; }
    .score-box span { color: #58a6ff; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>GitHub Repo Analyzer</h1>
    <p class="subtitle">Analyze GitHub repositories for activity, complexity, and learning difficulty</p>

    <textarea id="urlInput" placeholder="Enter GitHub repo URLs (one per line)&#10;https://github.com/facebook/react&#10;https://github.com/torvalds/linux"></textarea>
    <button id="analyzeBtn" onclick="analyze()">Analyze Repositories</button>

    <div id="results"></div>
  </div>

  <script>
    async function analyze() {
      const input = document.getElementById('urlInput').value.trim();
      const resultsDiv = document.getElementById('results');
      const btn = document.getElementById('analyzeBtn');

      if (!input) {
        resultsDiv.innerHTML = '<p style="color:#f85149;text-align:center;">Please enter at least one GitHub URL</p>';
        return;
      }

      const urls = input.split('\n').map(u => u.trim()).filter(u => u.length > 0);

      btn.disabled = true;
      btn.textContent = 'Analyzing...';
      resultsDiv.innerHTML = '<div class="loading">Fetching repository data...</div>';

      try {
        const response = await fetch('/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ urls })
        });

        const data = await response.json();
        renderResults(data.results);
      } catch (err) {
        resultsDiv.innerHTML = '<div class="error-card">Failed to connect to server. Please try again.</div>';
      }

      btn.disabled = false;
      btn.textContent = 'Analyze Repositories';
    }

    function renderResults(results) {
      const resultsDiv = document.getElementById('results');
      if (!results || results.length === 0) {
        resultsDiv.innerHTML = '<p style="text-align:center;color:#8b949e;">No results found.</p>';
        return;
      }

      let html = `<h2 style="margin-bottom:20px;color:#c9d1d9;">Results (${results.length} repositories)</h2>`;

      results.forEach(repo => {
        if (repo.error) {
          html += `<div class="error-card">❌ <strong>${repo.url}</strong> — ${repo.error}</div>`;
          return;
        }

        html += `
          <div class="card">
            <h2><a href="${repo.url}" target="_blank" style="color:#58a6ff;text-decoration:none;">${repo.name}</a></h2>
            <p>${repo.description}</p>
            <span class="badge ${repo.difficulty}">${repo.difficulty}</span>
            <div class="scores">
              <div class="score-box">Activity Score: <span>${repo.activityScore}</span></div>
              <div class="score-box">Complexity Score: <span>${repo.complexityScore}</span></div>
            </div>
            <div class="stats">
              <div class="stat"><div class="value">${repo.stars}</div><div class="label">Stars</div></div>
              <div class="stat"><div class="value">${repo.forks}</div><div class="label">Forks</div></div>
              <div class="stat"><div class="value">${repo.openIssues}</div><div class="label">Open Issues</div></div>
              <div class="stat"><div class="value">${repo.contributors}</div><div class="label">Contributors</div></div>
              <div class="stat"><div class="value">${repo.commits}</div><div class="label">Commits</div></div>
            </div>
            <div class="languages">
              ${repo.languages.map(l => `<span class="lang-tag">${l}</span>`).join('')}
            </div>
          </div>`;
      });

      resultsDiv.innerHTML = html;
    }
  </script>
</body>
</html>
