<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Repo Analyzer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      padding: 30px 15px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #58a6ff;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #8b949e;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      background: #161b22;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 10px;
      border-radius: 6px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background: #238636;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #2ea043;
    }

    button:disabled {
      background: #444;
      cursor: not-allowed;
    }

    #results {
      margin-top: 25px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 15px;
      font-size: 12px;
      margin-top: 5px;
    }

    .Beginner { background: #1f6feb; }
    .Intermediate { background: #d29922; }
    .Advanced { background: #da3633; }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .stat {
      background: #0d1117;
      border: 1px solid #21262d;
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 12px;
    }

    .lang {
      display: inline-block;
      background: #21262d;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      margin: 2px;
    }

    .error {
      background: #1c1414;
      border: 1px solid #da3633;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .loading {
      text-align: center;
      color: #58a6ff;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>GitHub Repo Analyzer</h1>
    <p class="subtitle">Paste repo links below (one per line)</p>

    <textarea id="input"></textarea>
    <button id="btn">Analyze</button>

    <div id="results"></div>
  </div>

  <script>
    const btn = document.getElementById('btn');
    const input = document.getElementById('input');
    const resultsDiv = document.getElementById('results');

    btn.addEventListener('click', handleAnalyze);

    async function handleAnalyze() {
      const value = input.value.trim();

      if (!value) {
        resultsDiv.innerHTML = '<p style="color:red;text-align:center;">Enter at least one repo</p>';
        return;
      }

      const urls = value
        .split('\n')
        .map(v => v.trim())
        .filter(Boolean);

      setLoading(true);

      try {
        const res = await fetch('/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ urls })
        });

        const data = await res.json();
        render(data.results || []);
      } catch (err) {
        resultsDiv.innerHTML = '<div class="error">Failed to connect</div>';
      }

      setLoading(false);
    }

    function setLoading(state) {
      btn.disabled = state;
      btn.textContent = state ? 'Analyzing...' : 'Analyze';

      if (state) {
        resultsDiv.innerHTML = '<div class="loading">Loading...</div>';
      }
    }

    function render(list) {
      if (!list.length) {
        resultsDiv.innerHTML = '<p>No results</p>';
        return;
      }

      let html = '';

      list.forEach(repo => {
        if (repo.error) {
          html += `<div class="error">${repo.error}</div>`;
          return;
        }

        html += createCard(repo);
      });

      resultsDiv.innerHTML = html;
    }

    function createCard(repo) {
      const langs = (repo.languages || [])
        .map(l => `<span class="lang">${l}</span>`)
        .join('');

      return `
        <div class="card">
          <h3>
            <a href="${repo.url}" target="_blank" style="color:#58a6ff;">
              ${repo.name}
            </a>
          </h3>

          <p>${repo.description || 'No description'}</p>

          <div class="badge ${repo.difficulty}">
            ${repo.difficulty}
          </div>

          <div style="margin-top:8px;font-size:13px;">
            Activity: ${repo.activityScore} |
            Complexity: ${repo.complexityScore}
          </div>

          <div class="stats">
            ${stat(repo.stars, 'Stars')}
            ${stat(repo.forks, 'Forks')}
            ${stat(repo.contributors, 'Contributors')}
            ${stat(repo.commits, 'Commits')}
          </div>

          <div style="margin-top:8px;">
            ${langs || '<span style="color:#888;">No languages</span>'}
          </div>
        </div>
      `;
    }

    function stat(value, label) {
      return `<div class="stat">${value || 0} ${label}</div>`;
    }
  </script>
</body>
</html>
